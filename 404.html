<!DOCTYPE html>
<html lang="cn-zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 你好像迷路啦</title>
    <style>
        * {
            margin: 0;
        }

        html {
            font-size: clamp(16px, calc(0.8vw + 8px), 24px);
        }

        body {
            background-color: #e6f2fe;
            color: #7087a0;
            font-family: "Segoe UI", "Microsoft YaHei", "微软雅黑", sans-serif;
        }

        h1 {
            font-size: clamp(4rem, 15vw, 9rem);
        }

        div,
        p,
        h1,
        span {
            padding: 0.28rem 2rem 0.5rem 2rem;
        }

        .span1 {
            font-size: 3rem;
        }

        .p1 {
            font-size: 1.28rem;
        }

        .restart-btn {
            display: none;
            margin-top: 2rem;
            margin-left: 2rem;
            background: transparent;
            color: #7087a0;
            border: 1px solid rgba(112, 125, 160, 0.8);
            padding: 0.6em 2em;
            font-size: clamp(14px, 1.6vw, 20px);
            font-family: inherit;
            cursor: pointer;
        }

        .link {
            font-size: clamp(14px, 1.6vw, 20px);
            color: #7087a0;
            text-decoration: none;
            border-bottom: 1px solid rgba(142, 158, 201, 0.8);
        }

        .restart-btn:hover {
            background: rgba(255, 255, 255, 0.395);
        }

        .link:hover {
            border-bottom-color: #7087a0;
            ;
        }

        @media (max-width: 600px) {
            body {
                padding: 6vh 6vw;
            }

            div,
            p,
            h1,
            span {
                padding: 0.28rem;
            }

            .restart-btn {
                margin-left: 0.28rem;
            }

            .span1 {
                font-size: 2rem;
            }
        }

        #progress {
            padding: 0;
        }
    </style>
</head>


<body>
    <h1>:&lpar;</h1>
    <span class="span1">404 NOT FOUND</span>
    <p class="p1">你的URL遇到问题，需要重新定向。我们只浪费你的一些时间，然后为你重定向。</p>
    <div class="progress">
        <span id="progress">0</span>% 完成
    </div>
    <p>如果要了解更多信息，可以搜索此错误：404_PAGE_NOT_FOUND</p>
    <div>
        有关此问题的详细信息和可能的解决方法，请访问<a class="link" href="https://Tank37135.com" target="_blank"
            rel="noopener">https://Tank37135.com</a></div>
    <button class="restart-btn" id="restartBtn" onclick="location.href='/'">
        重新定向
    </button>
</body>
<script>
    (function () {
        const progressEl = document.getElementById('progress');
        const restartBtn = document.getElementById('restartBtn');
        let progress = 0;

        const timer = setInterval(() => {
            progress += Math.floor(Math.random() * 10) + 1;

            if (progress >= 100) {
                progress = 100;
                clearInterval(timer);
                restartBtn.style.display = 'inline-block';
            }

            progressEl.textContent = progress;
        }, 300);
    })();
</script>

</html>
