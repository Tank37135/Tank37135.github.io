<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0a14">
  <script data-theme-boot>
    (function () {
      try {
        var t = localStorage.getItem("tank37135-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "light" ? "#f1f9fe" : "#0b0a14");
      } catch (e) {}
    })();
  </script>
  <style>
    html { background: #0b0a14; }
    html[data-theme="light"] { background: #f1f9fe; }
  </style>
  <title>工具 | Tank37135</title>
  <meta name="description" content="在浏览器里直接运行的屏幕录制与声波探测工具，所有处理都在本地完成。">
  <meta name="author" content="Tank37135">
  <link rel="canonical" href="https://tank37135.com/category/tools/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tank37135">
  <meta property="og:title" content="工具 | Tank37135">
  <meta property="og:description" content="在浏览器里直接运行的屏幕录制与声波探测工具，所有处理都在本地完成。">
  <meta property="og:url" content="https://tank37135.com/category/tools/">
  <meta property="og:image" content="https://tank37135.com/assets/img/LOGO/logo-1024x1024.png">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../../assets/img/LOGO/logo-128x128.png">
  <link rel="stylesheet" href="../../assets/main.css">
</head>

<body data-page="tools" data-section="tools">

  <main id="main" tabindex="-1">

      <h1 class="heading-1 page-header__title" data-copy="tools.title"></h1>

    </section>

</body>

</html>
