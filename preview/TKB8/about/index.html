<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0a14">
  <script data-theme-boot>
    (function () {
      try {
        var t = localStorage.getItem("tank37135-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "light" ? "#f1f9fe" : "#0b0a14");
      } catch (e) {}
    })();
  </script>
  <style>
    html { background: #0b0a14; }
    html[data-theme="light"] { background: #f1f9fe; }
  </style>
  <title>关于 | Tank37135</title>
